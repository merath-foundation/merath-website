  merath — THE LIBYAN FILM ARCHIVE · v3 "census"  (24.10.2026, revised)
  ====================================================================
  /archives/film, grown from v2-mosaic into the archives page's language
  (v20 → v21): the same chrome, the same ramp, the film archive's own mark
  (a box, filled where a copy is known, hollow where none is), and the
  decades as beds whose contacts breathe with the scroll.

  v2's rulings are kept (DESIGN_FILM_DATABASE.md):
   · a survival census, not a catalogue — the page leads with what survives
   · the record sets the block: a lead is a full band with no numeral; a film
     with its poster held is a plate; a dated film carries its year as display
     type; a thin record gets a thin block, its numeral suppressed
   · chronology is the spine; the undated have a list of their own
   · records are pages, not modals: #r/08_Flm_112 is the record's address here
     (/archives/film/08_Flm_112 when built)

  Revised 24.10 (moad):
   · the text is the public overlay: no "verify", no hedged year, no unsure
     name (archives/data/film-public-2026-10-24.json). A blank field is shown
     as not yet known, never guessed.
   · Submit a Record sits at the top of the database, under the nav and the
     search, above the first decade. It is the five-step form of
     DESIGN_FILM_SUBMISSION, and it saves: each entry is sent to the Sheet
     "08_Film database — submissions from merath.ly" (7. Archives) through a
     Zapier catch hook, and the draft is kept in this browser as you type.
   · one sticky header carries the nav and the search together.
   · the reader's language is remembered (localStorage merath.lang, as the site).
   · no register of holders on this page for now.

  Prototype only, local. Data: archives/data/snapshot-2026-10-24.json via
  archives/make-proto.py.

  --b0:#F7F1E1;--b1:#EFE3C8;--b2:#C79A63;--b3:#40301F;--rock:#1A1410;
  --held:#E86A2C;--post:#2E8FA8;--stew:#C0395A;--unc:#7A5CC4;
  --textL:8vw;--textR:8vw;--ang:190px}
body{background:var(--cream);color:var(--ink);
  font-family:"29LT Bukra","IBM Plex Sans Arabic","Helvetica Neue",Arial,system-ui,sans-serif;
  text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.id{font-family:"IBM Plex Mono",ui-monospace,monospace;unicode-bidi:isolate}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

/* ── chrome · verbatim from about.html ─────────────────────────────── */
header{position:fixed;top:0;left:var(--textL);right:var(--textR);z-index:20;display:flex;
  justify-content:space-between;align-items:baseline;padding-top:26px}
header .wm{font-size:19px;font-weight:500}
header .wm a{color:var(--ink);text-decoration:none}
nav{position:relative;z-index:1}
nav a{font-size:12px;margin-inline-start:24px;color:var(--cream);text-decoration:none;letter-spacing:.02em;cursor:pointer}
nav a:hover{border-bottom:1.5px solid var(--cream)}
nav a.on{color:var(--saff);cursor:default}
#lang-btn{font-size:12px;line-height:1.4;letter-spacing:.02em;font-family:inherit}
#nav-strip{position:absolute;background:var(--ink);z-index:0;transition:left .9s steps(8,jump-none),width .9s steps(8,jump-none);
  clip-path:polygon(8px 0,calc(100% - 6px) 0,100% 12%,calc(100% - 7px) 26%,100% 43%,calc(100% - 5px) 58%,100% 74%,calc(100% - 8px) 88%,calc(100% - 2px) 100%,6px 100%,0 86%,7px 70%,1px 55%,8px 40%,2px 24%,9px 10%)}
#nav-strip.tearing{animation:stripTear .9s steps(4,jump-none)}
@keyframes stripTear{0%{transform:translateY(0)}30%{transform:translateY(-1.6px) rotate(.4deg)}55%{transform:translateY(1.2px) rotate(-.35deg)}80%{transform:translateY(-.8px) rotate(.2deg)}100%{transform:translateY(0)}}
#m-head{display:none;background:var(--ink);padding:8px 15px 10px;gap:18px;
  clip-path:polygon(5px 0,100% 0,calc(100% - 4px) 28%,100% 52%,calc(100% - 5px) 100%,4px 100%,0 68%,5px 34%)}
#m-head a{color:var(--cream);font-size:13px;cursor:pointer;text-decoration:none}
#fold-wrap{position:absolute;top:0;inset-inline-start:0;width:0;height:0;z-index:21;opacity:0;transition:opacity .35s .85s}
#fold-wrap.on{opacity:1}
#mini-tree{position:absolute;top:0;inset-inline-start:0;overflow:visible;pointer-events:none}
#mini-tree path{fill:none;stroke:var(--ink);stroke-width:1;stroke-linecap:round}
#mini-tree .foldg{transition:transform .55s cubic-bezier(.34,1.18,.4,1)}
#mini-tree.pull .foldg{transform:scale(1.65)}
#mini-tree .flapg{transition:transform .55s cubic-bezier(.3,.9,.3,1.18)}
#mini-tree.pull .flapg{transform:rotate(var(--ca)) scaleY(1.16) rotate(var(--nca))}
#mini-tree text.mrfind{font-family:inherit;font-size:11px;letter-spacing:.13em;fill:var(--ink);opacity:.72;text-transform:uppercase}

#sidx{position:sticky;top:74px;z-index:15;margin:0 var(--textR) 0 var(--textL);
  display:flex;align-items:center;background:var(--ink);height:38px;padding:0 20px;
  clip-path:polygon(7px 0,calc(100% - 5px) 0,100% 14%,calc(100% - 6px) 30%,100% 46%,calc(100% - 4px) 62%,100% 78%,calc(100% - 7px) 92%,calc(100% - 2px) 100%,6px 100%,0 88%,6px 72%,1px 56%,7px 42%,2px 26%,8px 11%)}
#sidx a{display:flex;align-items:baseline;gap:.5rem;color:var(--cream);text-decoration:none;
  font-size:11px;padding:0 16px;cursor:pointer;white-space:nowrap;opacity:.72}
#sidx a:first-child{padding-inline-start:0}
#sidx a .o{font-size:9px;letter-spacing:.16em;opacity:.6}
#sidx a:hover{opacity:1}
#sidx a.on{color:var(--saff);opacity:1}
#sidx .sp{flex:1}
#sidx .ct{font-size:9px;letter-spacing:.16em;color:var(--cream);opacity:.45}

main{position:relative;z-index:4;padding-top:17vh}
.head{padding:0 var(--textR) 3.4rem var(--textL);max-width:74ch}
.head h1{font-size:clamp(30px,4.4vw,48px);font-weight:500;letter-spacing:-.018em;line-height:1.04;margin-bottom:.6rem}
.head p{font-size:14px;line-height:1.8;opacity:.82;max-width:56ch}
.axis{margin-top:1.6rem;font-size:10px;letter-spacing:.15em;opacity:.5;text-transform:uppercase}

#apron{position:relative;background:var(--b0);padding:3.4rem var(--textR) 5rem var(--textL)}
.zh{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap}
.zh .ord{font-size:9.5px;letter-spacing:.2em;color:var(--saff)}
.zh h2{font-size:clamp(20px,1.5vw + 12px,32px);font-weight:600;letter-spacing:-.014em}
.zh .kind{font-size:9.5px;letter-spacing:.18em;opacity:.45;text-transform:uppercase}
.zh em{flex-basis:100%;font-style:normal;font-size:12.5px;line-height:1.72;opacity:.76;max-width:60ch;margin-top:.4rem}
.searchrow{margin-top:2rem;width:min(46ch,74vw);display:flex;align-items:baseline;
  border-bottom:1.5px solid var(--ink);padding-bottom:.35rem}
.searchrow input{flex:1;border:0;outline:0;background:none;font-family:inherit;font-size:17px;
  color:var(--ink);min-width:0;caret-color:var(--lime)}
.searchrow input::placeholder{opacity:.32;color:var(--ink)}
#srn{margin-top:.5rem;font-size:10px;letter-spacing:.1em;opacity:.6;min-height:1.2em}
#near{margin-top:.7rem;font-size:11.5px;line-height:1.75;max-width:54ch;opacity:0;transition:opacity .3s}
#near.on{opacity:.92}
#near b{display:block;font-weight:500;margin-bottom:.3rem}
#near span{display:block;opacity:.7;font-size:11px}
#fieldwrap{position:relative;margin-top:2.2rem;height:min(50vh,440px)}
#fld{position:absolute;inset:0;width:100%;height:100%}
.ucap{position:absolute;inset-inline-end:0;bottom:-16px;font-size:9px;letter-spacing:.12em;opacity:.42}

/* ── the section ──────────────────────────────────────────────────── */
#sect{position:relative}
/* HEIGHT IS A STATE, AND THE STATE IS MOSTLY SET BY WHERE YOU ARE.
   1.0 resting · 1.2 the bed your eye is in · 1.5 the beds either side of
   an opened one · open. Nothing is at 1.5 unless something is open, so the
   section sits compressed until you engage with it. */
.bed{position:relative;cursor:pointer;margin-top:calc(var(--ang) * -1);overflow:hidden;
  transition:height .44s steps(7,jump-none)}
.bed::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;
  background:linear-gradient(to bottom,transparent 34%,rgba(20,24,28,.15))}
.bed.dark::after{background:linear-gradient(to bottom,transparent 34%,rgba(0,0,0,.35))}
/* the slice sits above everything in the bed but below the labels */
.contact{position:absolute;inset-inline:0;top:0;height:calc(var(--ang) + 10px);z-index:7;
  pointer-events:none;overflow:visible}
.contact polyline{fill:none;vector-effect:non-scaling-stroke}
.contact polygon{stroke:none}
.capdate{position:absolute;inset-inline-end:var(--textR);z-index:10;font-size:9.5px;
  letter-spacing:.16em;pointer-events:none}

.bl{position:absolute;inset-inline:var(--textR) var(--textL);top:calc(var(--ang) + 16px);z-index:9;
  display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;pointer-events:none}
.bl .ord{font-size:9.5px;letter-spacing:.2em;color:var(--saff)}
.bl strong{font-size:clamp(20px,1.4vw + 12px,30px);font-weight:600;letter-spacing:-.014em;line-height:1.04}
.bl .kind{font-size:9.5px;letter-spacing:.18em;opacity:.45;text-transform:uppercase}
.bl .sig{font-size:10.5px;letter-spacing:.04em;opacity:.62}
.bl em{flex-basis:100%;font-style:normal;font-size:12.5px;line-height:1.7;opacity:.75;max-width:58ch;margin-top:.35rem}
.state{position:absolute;inset-inline-end:var(--textR);top:calc(var(--ang) + 20px);
  font-size:9px;letter-spacing:.18em;opacity:.36;pointer-events:none;text-transform:uppercase;z-index:9}
.bed.dark,.bed.dark .bl strong{color:var(--cream)}

/* ── archives: signage, not blocks ────────────────────────────────── */
.cols{position:absolute;inset-inline:var(--textR) var(--textL);
  top:var(--ang);bottom:var(--ang);display:flex;align-items:stretch;z-index:5}
.bed.last .cols{bottom:0}
.col{position:relative;cursor:pointer;overflow:hidden;min-width:56px;
  transition:flex-grow .36s steps(5,jump-none)}
.col+.col{border-inline-start:1px solid rgba(20,24,28,.42)}
.bed.dark .col+.col{border-inline-start-color:rgba(247,241,225,.38)}
.tex{position:absolute;inset:0;z-index:1;opacity:.6;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,transparent 54px,#000 112px);
  mask-image:linear-gradient(to bottom,transparent 0,transparent 54px,#000 112px)}
.col:hover .tex{opacity:.95}
.col.sel .tex{opacity:.12}
/* the count as display type, cropped by the column the way a numeral is
   cropped on a stratigraphic log. this is what makes an archive findable. */
.big{position:absolute;inset-inline-start:-.055em;bottom:44px;z-index:3;pointer-events:none;
  font-size:clamp(34px,5.4vw,110px);font-weight:600;letter-spacing:-.055em;line-height:.78;
  color:var(--ac);white-space:nowrap;transition:font-size .44s steps(7,jump-none)}
.big sup{font-size:.34em;font-weight:500;letter-spacing:0;vertical-align:super;margin-inline-start:.04em}
.big.dash{font-size:clamp(30px,4.4vw,86px);opacity:.85}
/* the numeral grows with the bed, so scrolling into a zone enlarges its
   signage as well as its ground */
.bed.s12 .big{font-size:clamp(40px,6.4vw,132px)}
.bed.s15 .big,.bed.sopen .big{font-size:clamp(46px,7.4vw,156px)}
.nm{position:absolute;inset-inline:12px 8px;bottom:24px;z-index:3;pointer-events:none;
  font-size:clamp(13px,.9vw + 7px,20px);font-weight:600;line-height:1.08;letter-spacing:-.012em}
.mt{position:absolute;inset-inline:12px 8px;bottom:8px;z-index:3;pointer-events:none;
  font-size:9.5px;letter-spacing:.06em;opacity:.72;display:flex;gap:.7rem;flex-wrap:wrap}
.mt .cu{color:var(--ac);letter-spacing:.12em}
.col .kid{position:absolute;inset-inline-start:12px;top:14px;z-index:3;font-size:9px;
  letter-spacing:.06em;opacity:.5;pointer-events:none}
.foot{position:absolute;inset-inline:0;bottom:0;height:4px;background:var(--ac);z-index:4}
.col.post .foot,.col.unc .foot{height:3px;
  background:repeating-linear-gradient(90deg,var(--ac) 0 8px,transparent 8px 15px)}
.col.sel{background:rgba(247,241,225,.94)}
.bed.dark .col.sel{background:rgba(20,24,28,.9)}
.col.rib .big,.col.rib .nm,.col.rib .mt{display:none}
.col.rib .vn{position:absolute;top:14px;inset-inline-start:8px;writing-mode:vertical-rl;
  font-size:12px;font-weight:600;white-space:nowrap;z-index:3;color:var(--ac)}
.vn{display:none}
.col.rib .vn{display:block}
.rec{position:absolute;inset:0;padding:16px 16px 46px;overflow:auto;opacity:0;pointer-events:none;
  transition:opacity .22s .14s;z-index:5}
.col.sel .rec{opacity:1;pointer-events:auto}
.rec h3{font-size:17px;font-weight:600;letter-spacing:-.012em}
.rec .bs{font-size:9px;opacity:.6;letter-spacing:.05em;margin-bottom:.5rem}
.rec p{font-size:11.5px;line-height:1.66;opacity:.9;margin-bottom:.6rem;max-width:58ch}
.it{display:grid;grid-template-columns:76px minmax(0,1fr) auto auto;gap:.55rem;align-items:baseline;
  padding:.3rem 0;border-bottom:1px solid currentColor;font-size:11px;opacity:.9}
.it .a,.it .d{font-size:8.5px;opacity:.6}
.it .ch{font-size:9px;opacity:.85;color:var(--ac)}
.it.dead b{opacity:.6}

.lam{position:absolute;inset-inline:var(--textR) var(--textL);
  top:calc(var(--ang) + 96px);bottom:126px;overflow:hidden;z-index:5}
.la{border-top:1px solid rgba(247,241,225,.2);padding:10px 0;cursor:pointer;
  display:flex;align-items:center;gap:1.1rem;transition:background .2s}
.la:hover{background:rgba(247,241,225,.055)}
.la b{font-size:13px;font-weight:500;flex:none;min-width:22ch}
.la .g{font-size:10.5px;opacity:.6;flex:1;line-height:1.5}
.la .gv{font-size:9px;letter-spacing:.1em;color:var(--saff);flex:none}
.la .lk{font-size:9px;letter-spacing:.12em;opacity:.4;flex:none}
.la.floor{opacity:.6;border-top-style:dashed}
.bedrock{position:absolute;inset-inline:0;bottom:0;height:106px;background:var(--rock);
  border-top:3px solid var(--ink);z-index:8}

footer{position:relative;z-index:5;background:var(--saff);color:var(--cream);
  padding:9vh var(--textR) calc(5vh + 74px) var(--textL);text-align:center}
footer .flogo{width:86px;display:block;margin:0 auto 22px}
footer .socials{display:flex;justify-content:center;gap:18px;margin-bottom:22px}
footer .socials a{color:var(--cream)}footer .socials svg{width:19px;height:19px}
footer .fx{max-width:60ch;margin:0 auto;font-size:14px;line-height:1.9}
footer .fcredit{margin:22px auto 0;max-width:64ch;font-size:11px;line-height:1.9;opacity:.85}
footer .fcredit a{color:var(--cream)}
footer .ftype{display:block;margin-top:7px;opacity:.8}
footer .ftype-ar{display:none}
[dir="rtl"] footer .ftype-en{display:none}
[dir="rtl"] footer .ftype-ar{display:inline}
footer .fl{margin-top:14px;font-size:11.5px;letter-spacing:.14em}
#ticker{position:fixed;bottom:0;left:0;right:0;z-index:19;background:var(--ink);color:var(--cream);
  display:flex;align-items:stretch;height:42px;transform:translateY(140%);
  transition:transform .7s cubic-bezier(.2,.75,.2,1),height .35s cubic-bezier(.2,.7,.2,1)}
#ticker.show{transform:none}
#ticker:hover{height:66px}
.tk-tear{position:absolute;top:-7px;left:0;right:0;height:8px;background:var(--ink);clip-path:polygon(0 100%,2% 20%,5% 90%,9% 10%,13% 80%,18% 25%,23% 95%,28% 15%,33% 75%,38% 30%,44% 90%,49% 10%,55% 85%,60% 20%,66% 95%,71% 25%,77% 80%,82% 12%,88% 90%,93% 22%,97% 75%,100% 100%)}
.tk-head{display:flex;align-items:center;gap:14px;padding:0 20px;flex:none;position:relative}
.tk-head::after{content:"";position:absolute;inset-inline-end:0;top:9px;height:24px;width:1px;background:rgba(247,241,225,.28)}
#tk-clock{font-size:11.5px;letter-spacing:.16em;color:var(--saff)}
.tk-lbl{font-size:13.5px}
.tk-view{flex:1;overflow:hidden;height:42px}
#tk-list{list-style:none;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
#tk-list li{height:42px;display:flex;align-items:center;gap:14px;padding:0 20px;
  font-size:clamp(9.5px,.65vw + 6px,12px);letter-spacing:.11em;text-transform:uppercase;white-space:nowrap}
#tk-list .tk-date{color:var(--saff);font-size:10.5px;letter-spacing:.16em;min-width:66px;flex:none}
.tk-sub{position:absolute;inset-inline-start:20px;bottom:7px;font-size:9px;letter-spacing:.2em;opacity:0;transition:opacity .3s;color:var(--saff)}
#ticker:hover .tk-sub{opacity:.95}

@media (max-width:920px){
  :root{--textL:30px;--textR:26px;--ang:118px}
  header{left:auto;right:auto;inset-inline-start:76px;inset-inline-end:18px;align-items:flex-start;padding-top:14px}
  nav,#nav-strip{display:none}
  #m-head{display:flex;align-items:baseline;gap:20px}
  #sidx{top:56px;height:32px;padding:0 12px;overflow-x:auto}
  #sidx a{padding:0 10px;font-size:10px}#sidx .sp,#sidx .ct{display:none}
  main{padding-top:13vh}
  .col{min-width:44px}.nm{font-size:13px}
  .la{flex-wrap:wrap;gap:.5rem}.la b{min-width:0}
  #mini-tree text.mrfind{display:none}
  #ticker{height:32px}.tk-view{height:32px}
  #tk-list li{height:32px;padding:0 12px;font-size:9.5px;text-transform:none}
  footer{padding:7vh var(--textR) calc(4vh + 60px) var(--textL)}
}

/* ══ v3 ═══════════════════════════════════════════════════════════════ */
:root{--dcream:#EFE7D2;--fc:var(--post);--mh:74px}
@media(max-width:920px){:root{--mh:56px}}
.introrow{display:grid;grid-template-columns:minmax(0,1fr) min(400px,34vw);gap:44px;align-items:start;padding:0 var(--textR) 2.4rem var(--textL)}
.crumb{display:flex;align-items:center;gap:.9rem;margin-bottom:1.2rem}
.backarc{display:inline-flex;align-items:center;gap:.45em;font-size:clamp(16px,.5vw + 13px,21px);font-weight:600;color:var(--ink);text-decoration:none;border:2px solid var(--ink);padding:.28em .85em .34em .65em;line-height:1.2;transition:background .15s,color .15s}
.backarc:hover{background:var(--ink);color:var(--cream)}
.backarc .ar{display:inline-block;font-size:1.1em;line-height:1}
.crumb .no{font-size:11px;letter-spacing:.14em;opacity:.55}
.introrow h1{font-size:clamp(30px,4.4vw,52px);font-weight:500;letter-spacing:-.018em;line-height:1.04;margin-bottom:.2rem}
.introrow h1 .o{display:block;font-size:.5em;opacity:.6;margin-top:.25em;font-weight:500}
/* the page title in merath Kufi (Latin only — the Arabic title keeps the site's face) */
html[lang="en"] .introrow h1 .ttl{font-family:"merath Kufi","29LT Bukra",sans-serif;font-weight:400;letter-spacing:.02em;font-size:clamp(38px,5.4vw,78px);line-height:.95;display:block}
html[lang="en"] .introrow h1 .o{font-size:clamp(15px,1.2vw + 8px,22px);margin-top:.55em;opacity:.7}
.pg-sub p{font-size:14.5px;line-height:1.9;max-width:62ch;margin:.9rem 0 0}
.pg-sub p:first-child{color:var(--saff);font-size:15.5px;line-height:1.95}
[dir="rtl"] .pg-sub p{font-size:16px}[dir="rtl"] .pg-sub p:first-child{font-size:17px}
/* the tally: the census as signage */
.tally{display:flex;flex-wrap:wrap;gap:0;margin-top:2rem;border-top:2px solid var(--ink)}
.tl{padding:.7rem 1.4rem .2rem 0;margin-inline-end:1.4rem;border-inline-end:1px solid rgba(20,24,28,.2)}
.tl:last-child{border:0}
.tl b{display:block;font-size:clamp(30px,3.6vw,56px);font-weight:600;letter-spacing:-.05em;line-height:.9;color:var(--c,var(--ink))}
.tl span{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.62;margin-top:.35rem;max-width:16ch}
[dir="rtl"] .tl span{font-size:11.5px;letter-spacing:0}
.tl.k{--c:var(--fc)}.tl.l{--c:var(--ink)}.tl.u{--c:#8a8578}
.intake{margin-top:1rem;font-size:11px;letter-spacing:.06em;opacity:.7;max-width:70ch;line-height:1.6}
/* the call, as on /archives and /programmes */
.calls-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-top:2px solid var(--ink);padding-top:11px;margin-bottom:16px}
.calls-head .ck{color:var(--saff);font-size:16px;line-height:1}
.calls-head h2{font-size:17px;font-weight:700;color:var(--saff)}[dir="rtl"] .calls-head h2{font-size:22px}
#submit .sh h2{color:var(--saff);font-weight:700}
.calls-head .oc-hint{flex-basis:100%;margin-top:7px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.5}
[dir="rtl"] .calls-head .oc-hint{font-size:12px;letter-spacing:.02em;text-transform:none}
.ocard{--cc:var(--fc);position:relative;display:block;text-decoration:none;color:var(--ink);background:#FBF7EA;border:1.2px solid var(--ink);border-top:3px solid var(--cc);
 padding:10px 13px 11px;cursor:pointer;transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s cubic-bezier(.2,.7,.2,1)}
.ocard:hover{transform:translate(-3px,-3px);box-shadow:6px 6px 0 rgba(20,24,28,.16)}
.oc-cat{display:inline-block;background:var(--cc);color:var(--cream);font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:2px 7px 3px;margin-bottom:7px}
[dir="rtl"] .oc-cat{font-size:11px;letter-spacing:.02em;text-transform:none}
.ocard h3{font-size:15px;font-weight:500;line-height:1.3;margin-bottom:5px}[dir="rtl"] .ocard h3{font-size:19px;line-height:1.45}
.ocard p{font-size:11.5px;line-height:1.6;opacity:.8;margin-bottom:9px}[dir="rtl"] .ocard p{font-size:13.5px;line-height:1.85}
.oc-go{display:inline-block;background:var(--ink);color:var(--cream);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;padding:5px 18px 6px 11px;clip-path:polygon(0 0,100% 0,calc(100% - 7px) 50%,100% 100%,0 100%)}
[dir="rtl"] .oc-go{font-size:12px;letter-spacing:.02em;text-transform:none;padding:7px 13px 8px 22px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,7px 50%)}
@media(max-width:1040px){.introrow{grid-template-columns:1fr;gap:4vh}}

/* ONE sticky header: the nav strip and the search travel together, on a
   solid ground, so nothing below can show through or sit under a gap */
.stick{position:sticky;top:var(--mh);z-index:16;background:var(--cream);padding:0 0 0;box-shadow:0 1px 0 rgba(20,24,28,.12)}
.stick #sidx{position:relative;top:auto;overflow-x:auto;scrollbar-width:none}
.stick #sidx::-webkit-scrollbar{display:none}
.stick::before{content:"";position:absolute;inset-inline:0;bottom:100%;height:var(--mh);background:var(--cream);opacity:0;pointer-events:none;transition:opacity .15s}
.stick.stuck::before{opacity:1}
@media(max-width:1300px){.stick #sidx .ct{display:none}}
@media(max-width:1360px){#sidx .grp .lbl{display:none}#sidx .grp a{padding:0 5px}}
#sidx{height:50px}
@media(min-width:921px){.stick #sidx{flex-wrap:wrap;height:auto;min-height:50px;overflow:visible}.stick #sidx a{height:50px}.stick #sidx.two a{height:40px}.stick #sidx .grp{flex-wrap:wrap}}
#sidx a{font-size:14.5px;font-weight:600;opacity:.85;height:100%;align-items:center}
#sidx a.add{color:var(--saff);opacity:1;font-weight:700}
#sidx a.on{background:var(--saff);color:var(--ink);opacity:1}
[dir="rtl"] #sidx a{font-size:16px}
@media(max-width:920px){#sidx{height:40px}#sidx a{font-size:12.5px}[dir="rtl"] #sidx a{font-size:14px}}
/* where you are: Archives / The Films Archive / 1970s / the film — the current level in a merath-yellow block */
.where{display:flex;align-items:center;gap:.65rem;white-space:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 var(--textR) 0 var(--textL);padding:.55rem 0;font-size:clamp(15px,.5vw + 12px,20px);font-weight:500;transition:font-size .25s,padding .25s}
.where::-webkit-scrollbar{display:none}
.where a{color:var(--ink);text-decoration:none;opacity:.6;border-bottom:1.5px solid rgba(20,24,28,.3);font-size:inherit;margin:0;letter-spacing:0}   /* the site nav rule (nav a: 12px, 24px start margin) must not reach the path */
.where a:hover{opacity:1;border-bottom-color:var(--saff)}
.where .sep{opacity:.3;font-weight:400}
.where .cur{font-weight:700;background:var(--saff);color:var(--ink);padding:.06em .45em .1em}
.stick.stuck .where{font-size:15px;padding:.35rem 0}
@media(max-width:920px){.where{font-size:14px}}
#sidx a.add .o{opacity:1}
#sidx .grp{display:flex;align-items:baseline;gap:0;opacity:.95}
#sidx .grp .lbl{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--cream);opacity:.4;padding:0 6px 0 14px}
[dir="rtl"] #sidx .grp .lbl{font-size:10px;letter-spacing:0}
#sidx .grp a{padding:0 7px}
.bar{margin:.5rem var(--textR) 0 var(--textL);background:var(--saff);color:var(--ink);padding:1.05rem 1.1rem;
 display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.2rem;transition:padding .25s}
.qbox{position:relative;flex:1 1 320px;display:flex;min-width:0}
.qbox input{flex:1;border:0;outline:0;background:none;font-family:inherit;font-weight:600;color:var(--ink);min-width:0;caret-color:var(--ink);padding:0;padding-inline-start:14px}
.qbox input::placeholder{color:var(--ink);opacity:.45;font-weight:500}
.qbox input::-webkit-search-cancel-button{filter:grayscale(1)}
.qbox input{text-overflow:ellipsis}
[dir="rtl"] .qbox input:placeholder-shown{direction:rtl}   /* dir=auto reads an empty box as LTR and cuts the Arabic placeholder at its start */
.stick.stuck .bar{padding:.45rem .9rem;margin-top:0}

.bar .f{font:inherit;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border:1.5px solid var(--ink);background:none;padding:4px 10px 5px;cursor:pointer;color:var(--ink);font-weight:600}
.bar .f[aria-pressed="true"]{background:var(--ink);color:var(--cream);border-color:var(--ink)}
[dir="rtl"] .bar .f{letter-spacing:0;font-size:12px}
.bar .n{font-size:10.5px;letter-spacing:.1em;opacity:.8}

/* ── SUBMIT A RECORD, at the top of the database ─────────────────────── */
#submit{position:relative;z-index:4;background:#FBF7EA;border-bottom:2px solid var(--ink);padding:1.5rem var(--textR) 1.6rem var(--textL);scroll-margin-top:200px}
.sb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:1.2rem 2.4rem;align-items:end}
.sh{display:flex;align-items:baseline;gap:.9rem;flex-wrap:wrap}
.sh .ord{font-size:9.5px;letter-spacing:.2em;color:var(--saff)}
.sh h2{font-size:clamp(20px,1.5vw + 12px,30px);font-weight:600;letter-spacing:-.014em}
.sh em{flex-basis:100%;font-style:normal;font-size:12.5px;line-height:1.7;opacity:.76;max-width:64ch}
.sq{display:flex;gap:.8rem;align-items:flex-end;flex-wrap:wrap}
.sq input{flex:1 1 240px;border:0;border-bottom:1.5px solid var(--ink);background:none;font:inherit;font-size:17px;padding:.3rem 0;outline:0;caret-color:var(--lime);min-width:0;color:var(--ink)}
.go2{display:inline-block;background:var(--ink);color:var(--cream);font:inherit;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:8px 22px 9px 14px;text-decoration:none;border:0;cursor:pointer;
 clip-path:polygon(0 0,100% 0,calc(100% - 8px) 50%,100% 100%,0 100%)}
[dir="rtl"] .go2{letter-spacing:.02em;text-transform:none;font-size:12.5px;padding:8px 14px 9px 22px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,8px 50%)}
.go2:hover{background:var(--saff)}
.go2[disabled]{opacity:.5;cursor:default}
.lk{font:inherit;font-size:11px;letter-spacing:.06em;background:none;border:0;border-bottom:1px solid currentColor;padding:0 0 1px;cursor:pointer;color:var(--ink)}
#ih{grid-column:1/-1}
#ih .m{display:flex;gap:.8rem;align-items:baseline;padding:.42rem 0;border-bottom:1px solid rgba(20,24,28,.15);font-size:13px;flex-wrap:wrap}
#ih .m span.t{flex:1 1 200px}
#ih .m em{font-style:normal;font-size:10px;letter-spacing:.08em;opacity:.6}
#ih p{font-size:12.5px;line-height:1.7;opacity:.8;margin-top:.6rem}
.draft{grid-column:1/-1;font-size:12px;display:flex;gap:1rem;flex-wrap:wrap;align-items:baseline;border-top:1px dashed rgba(20,24,28,.35);padding-top:.6rem}
.draft b{font-weight:500}
.choice{border:1.5px solid var(--ink);background:var(--cream);padding:1rem 1.1rem;margin-top:1rem;max-width:70ch}
.choice p{font-size:13px;line-height:1.7}
.choice .act{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:.8rem}
/* the open form */
.x{position:absolute;inset-inline-end:var(--textR);top:1.2rem;font:inherit;font-size:10.5px;letter-spacing:.08em;background:none;border:0;cursor:pointer;opacity:.7;color:var(--ink)}
.steps{display:flex;margin-top:1.1rem;border:1px solid var(--ink)}
.stp{flex:1;font:inherit;text-align:start;background:none;border:0;border-inline-end:1px solid var(--ink);padding:.5rem .7rem;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.45;cursor:pointer;color:var(--ink)}
[dir="rtl"] .stp{font-size:12px;letter-spacing:0;text-transform:none}
.stp:last-child{border-inline-end:0}
.stp.on{background:var(--ink);color:var(--cream);opacity:1}
.stp.done{opacity:.8}
.stp b{display:block;font-size:8.5px;opacity:.6;margin-bottom:.15rem;font-weight:500}
.form{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:2.6rem;margin-top:1.6rem}
.pane{display:none}.pane.on{display:block}
.q{margin-bottom:1.4rem}
.q>label,.q .lb{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;opacity:.62;margin-bottom:.35rem}
[dir="rtl"] .q>label,[dir="rtl"] .q .lb{font-size:13px;letter-spacing:0;text-transform:none}
.q .req{color:var(--saff);margin-inline-start:.4rem}
.q .hint{font-size:11.5px;line-height:1.6;opacity:.62;margin-top:.35rem;max-width:60ch}
[dir="rtl"] .q .hint{font-size:13px}
.q input,.q textarea,.q select{width:100%;border:0;border-bottom:1.5px solid var(--ink);background:none;font-family:inherit;font-size:16px;padding:.4rem 0;color:var(--ink);outline:0;border-radius:0}
.q textarea{resize:vertical;min-height:80px;line-height:1.55;font-size:14px}
.q input:focus,.q textarea:focus,.q select:focus{border-bottom-color:var(--saff)}
.q.need input{border-bottom-color:var(--saff)}
.opts{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.3rem}
.opt{font:inherit;font-size:11px;padding:5px 10px;border:1px solid rgba(20,24,28,.3);background:none;cursor:pointer;color:var(--ink)}
[dir="rtl"] .opt{font-size:13px}
.opt.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.refrow{display:grid;grid-template-columns:minmax(0,1fr) 140px 30px;gap:.7rem;align-items:end;margin-bottom:.7rem}
.refrow label{font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.55}
.refrow button{border:1px solid rgba(20,24,28,.3);background:none;cursor:pointer;font-size:14px;height:32px;color:inherit}
.addref{font:inherit;font-size:11px;letter-spacing:.08em;border:1px dashed rgba(20,24,28,.4);padding:6px 11px;cursor:pointer;display:inline-block;background:none;color:var(--ink)}
.dupe{border:1px solid var(--fc);background:rgba(46,143,168,.07);padding:.8rem .9rem;margin-top:.8rem;font-size:12px;line-height:1.6}
.dupe b{color:var(--fc);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:.4rem}
[dir="rtl"] .dupe b{font-size:12px;letter-spacing:0}
.dupe button.m{display:flex;width:100%;gap:.7rem;align-items:baseline;font:inherit;font-size:12.5px;text-align:start;background:none;border:0;border-bottom:1px solid rgba(46,143,168,.25);padding:.4rem 0;cursor:pointer;color:var(--ink)}
.dupe button.m em{font-style:normal;font-size:10px;opacity:.6;margin-inline-start:auto}
.dupe .act{margin-top:.6rem}
.fnav{display:flex;gap:.6rem;margin-top:1.6rem;align-items:center;flex-wrap:wrap}
.fnav .gh{font-size:10.5px;opacity:.55;margin-inline-start:auto}
.hp{position:absolute!important;inset-inline-start:-9999px;width:1px;height:1px;opacity:0}
.consent{font-size:12px;line-height:1.75;opacity:.82;margin-top:1.2rem;max-width:60ch}
/* the live record card: you see what you are creating */
.card{border:1.5px solid var(--ink);padding:1.1rem;position:sticky;top:calc(var(--mh) + var(--sth,96px) + 16px);background:var(--cream)}
.card .ct{font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.5;margin-bottom:.7rem}
[dir="rtl"] .card .ct{font-size:11px;letter-spacing:0}
.card .cy{font-size:clamp(26px,3vw,44px);font-weight:700;letter-spacing:-.045em;line-height:.9}
.card .cy.e{opacity:.2}
.card h4{font-size:18px;font-weight:600;margin-top:.5rem;line-height:1.2}
.card h4.e{opacity:.22;font-weight:500}
.card .cl{display:grid;grid-template-columns:88px minmax(0,1fr);gap:.5rem;font-size:11px;padding:.35rem 0;border-bottom:1px solid rgba(20,24,28,.15)}
.card .cl .k{opacity:.5;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase}
[dir="rtl"] .card .cl .k{font-size:11px;letter-spacing:0}
.card .cl .v.e{opacity:.25}
.card .resume{margin-top:.9rem;font-size:11px;line-height:1.65;opacity:.8}
.card code,.okcode{font-family:"IBM Plex Mono",monospace;color:var(--saff);font-size:13px;letter-spacing:.04em}
.msg{border-inline-start:3px solid var(--saff);background:rgba(232,106,44,.07);padding:.7rem .9rem;font-size:12.5px;line-height:1.65;margin:1rem 0 0;max-width:70ch}
.ok h2{font-size:clamp(24px,2.4vw,38px);font-weight:600;letter-spacing:-.02em}
.ok p{font-size:13.5px;line-height:1.75;max-width:64ch;margin-top:.6rem}
@media(max-width:860px){.sb{grid-template-columns:1fr}.form{grid-template-columns:1fr}.card{position:relative;top:auto}.refrow{grid-template-columns:1fr 110px 30px}
 .steps{overflow-x:auto}.stp{min-width:96px}}

/* the register: decades are beds */
#reg{position:relative}
.dec{position:relative;padding:calc(var(--bow,60px) * 2 + 10px) var(--textR) calc(var(--bow,60px) * 2 + 2.6rem) var(--textL);margin-top:calc(var(--bow,60px) * -2 - 14px)}
.dec:last-child{padding-bottom:2.6rem}
.dec:first-child{margin-top:0;padding-top:2rem}
.dec .contact{position:absolute;inset-inline:0;top:0;height:calc(var(--bow,60px) * 2 + 10px);pointer-events:none;overflow:visible;z-index:2}
.dec .contact polyline{fill:none;vector-effect:non-scaling-stroke}
.dec h2{position:relative;z-index:3;display:flex;align-items:baseline;gap:1rem;margin-bottom:1.2rem}
.dec h2 .dn{font-size:clamp(46px,7vw,128px);font-weight:600;letter-spacing:-.06em;line-height:.8;color:var(--fc);margin-inline-start:-.05em}
.dec h2 .dk{font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.6}
.grid{position:relative;z-index:3;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px;grid-auto-flow:dense}
.b{position:relative;display:block;text-decoration:none;color:var(--ink);background:rgba(251,247,234,.88);border-top:3px solid var(--ink);padding:24px 12px 30px;min-height:150px;cursor:pointer;transition:background .25s}
.b:hover{background:#FFFDF6}
.b.s3{grid-column:span 3}.b.s2{grid-column:span 2;min-height:120px}.b.s4{grid-column:span 4;grid-row:span 2}
.b .yr{display:block;font-size:clamp(30px,3vw,48px);font-weight:600;letter-spacing:-.05em;line-height:.85;margin-bottom:.5rem}
.b .tt{display:block;font-size:14px;font-weight:500;line-height:1.25;letter-spacing:-.005em}
.b .tt2{display:block;font-size:11.5px;opacity:.6;margin-top:2px}
.b .dr{display:block;font-size:10.5px;opacity:.7;margin-top:.45rem;line-height:1.4}
.b .cd{position:absolute;inset-inline-end:10px;top:7px;font-size:8.5px;opacity:.5;z-index:3}
.b.s4 .cd{background:var(--cream);padding:1px 4px;opacity:.8}
.b .sv{position:absolute;inset-inline-start:12px;bottom:10px;display:flex;align-items:center;gap:6px;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
[dir="rtl"] .b .sv{font-size:10px;letter-spacing:0}
.b .gaps{position:absolute;inset-inline-end:10px;bottom:10px;font-size:8.5px;letter-spacing:.1em;color:var(--stew)}
.box{display:inline-block;width:8px;height:8px;border:1.2px solid var(--fc)}
.box.f{background:var(--fc)}.box.l{border-color:var(--ink);background:repeating-linear-gradient(45deg,transparent 0 2px,var(--ink) 2px 3px)}
/* a plate: the poster is held — the block is its image */
.b.s4 .pl{display:block;aspect-ratio:2/3;max-height:300px;margin:-2px 0 .7rem;background:var(--b1);position:relative;overflow:hidden}
.b.s4 .pl::before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle,var(--ink) 0 1.1px,transparent 1.6px) 0 0/7px 7px;opacity:.28;transform:rotate(15deg)}
.b.s4 .pl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.b.s4 .pl span{position:absolute;inset-inline:10px;bottom:10px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;background:var(--cream);padding:3px 6px;z-index:2}
[dir="rtl"] .b.s4 .pl span{font-size:11px;letter-spacing:0}
.b.hide{display:none}
/* one year, several films: one marker over the group, and each film still its own card */
.yg{grid-column:span var(--gs);display:flex;flex-direction:column;min-width:0;position:relative;z-index:3}
.yg .ygh{display:flex;align-items:baseline;gap:.75rem;border-top:3px solid var(--ink);padding:.6rem 0 .55rem}
.yg .ygh .yr{font-size:clamp(30px,3vw,48px);font-weight:600;letter-spacing:-.05em;line-height:.85}
.yg .ygh .ygn{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
[dir="rtl"] .yg .ygh .ygn{font-size:12.5px;letter-spacing:0}
.yg .ygc{display:grid;grid-template-columns:repeat(var(--gs),minmax(0,1fr));gap:10px;grid-auto-flow:dense;flex:1}
.yg .b{border-top-width:1.5px;box-shadow:0 2px 0 rgba(20,24,28,.10)}
.dec.dk .yg .ygh{border-top-color:var(--cream);color:var(--cream)}
.b.hit{box-shadow:inset 0 -3px 0 var(--lime)}
/* below the last decade, the ground: the films whose year is not yet known, then the leads */
.dec.dk h2 .dn{color:#86C6D8}.dec.dk h2 .dk{color:var(--cream);opacity:.75}
#und{padding:2.2rem var(--textR) 2.2rem var(--textL);background:#2B2117;color:var(--cream)}
#und .sh em{opacity:.8}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px 32px;margin-top:1.4rem}
.ug h3{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;border-top:2px solid var(--saff);padding-top:.55rem;margin-bottom:.5rem;display:flex;justify-content:space-between}
[dir="rtl"] .ug h3{font-size:12.5px;letter-spacing:0}
.ui{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.2rem .8rem;align-items:baseline;padding:.45rem 0;border-bottom:1px solid rgba(247,241,225,.16)}
.ui.hide{display:none}
.ui a.rl{display:flex;gap:.6rem;align-items:baseline;text-decoration:none;color:var(--cream);min-width:0}
.ui .t1{font-size:14px;font-weight:500}.ui .t2{display:block;font-size:11.5px;opacity:.65;margin-top:1px}.ui .t3{display:block;font-size:10.5px;opacity:.55;margin-top:2px}
.ui a.addy{font-size:10px;letter-spacing:.08em;color:var(--saff);text-decoration:none;white-space:nowrap}
[dir="rtl"] .ui a.addy{font-size:12px;letter-spacing:0}
/* leads: full bands, no numeral */
#leads{padding:2.2rem var(--textR) 2.4rem var(--textL);background:#1A1410;color:var(--cream)}
#leads summary,#und summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap}
#leads summary::-webkit-details-marker,#und summary::-webkit-details-marker{display:none}
#leads summary h2,#und summary h2{font-size:clamp(20px,1.5vw + 12px,30px);font-weight:600;letter-spacing:-.014em}
#leads summary .cnt,#und summary .cnt{font-size:12px;opacity:.7}
#und summary .kinds{flex-basis:100%;order:5;font-size:12px;opacity:.7;margin-top:.2rem}
#leads summary .tg,#und summary .tg{margin-inline-start:auto;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--saff);border:1px solid var(--saff);padding:4px 12px 5px}
[dir="rtl"] #leads summary .tg,[dir="rtl"] #und summary .tg{font-size:12.5px;letter-spacing:0}
#leads summary:hover .tg,#und summary:hover .tg{background:var(--saff);color:var(--ink)}
#und em.ue{display:block;font-style:normal;font-size:12.5px;line-height:1.7;opacity:.8;max-width:64ch;margin:.7rem 0 0}
#leads em.le{display:block;font-style:normal;font-size:12.5px;line-height:1.7;opacity:.78;max-width:64ch;margin:.6rem 0 .8rem}
.ld{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:1rem;align-items:baseline;text-decoration:none;color:var(--cream);border-top:1px solid rgba(247,241,225,.2);padding:.7rem 0 .8rem;margin-top:.2rem}
.ld b{font-size:15px;font-weight:500}.ld .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.65}
.ld .t2{display:block;font-size:11.5px;opacity:.7;margin-top:2px}
.ld.hide{display:none}
@media(max-width:920px){.bar{flex-wrap:wrap;gap:.55rem .6rem;padding:.75rem .8rem}.qbox{flex:1 1 100%}.qbox,.stick.stuck .qbox{font-size:20px}#filters{display:flex;gap:.35rem;flex:1 1 100%;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(to right,#000 86%,transparent);mask-image:linear-gradient(to right,#000 86%,transparent)}[dir="rtl"] #filters{-webkit-mask-image:linear-gradient(to left,#000 86%,transparent);mask-image:linear-gradient(to left,#000 86%,transparent)}#filters::-webkit-scrollbar{display:none}#filters .f{flex:none}.bar .n{flex:1 1 100%}
 .stick.stuck .bar #filters,.stick.stuck .bar .n{display:none}
 .grid{grid-template-columns:repeat(6,minmax(0,1fr))}.b.s4{grid-column:span 6}.b.s3{grid-column:span 3}.b.s2{grid-column:span 3}
 .yg{grid-column:span var(--gm)}.yg .ygc{grid-template-columns:repeat(var(--gm),minmax(0,1fr))}
 .ld{grid-template-columns:1fr}#sidx .grp .lbl{display:none}}

/* ── the record page ─────────────────────────────────────────────── */
#rec{display:none;padding:1.6rem var(--textR) 4rem var(--textL)}
body.r .introrow,body.r .bar,body.r #submit,body.r #reg,body.r #und,body.r #leads{display:none}
body.r #rec{display:block}
#rec .back{display:inline-flex;align-items:center;gap:.45em;font-size:clamp(15px,.4vw + 12px,19px);font-weight:600;color:var(--ink);text-decoration:none;border:2px solid var(--ink);padding:.24em .8em .3em .6em;letter-spacing:0;text-transform:none;font-family:inherit}
#rec .back:hover{background:var(--ink);color:var(--cream)}
[dir="rtl"] #rec .back .ar{display:inline-block;transform:scaleX(-1)}

 the other's former lover — lead a commando raid on Benghazi, and the desert return becomes a duel of cowardice and honour. Location-shot in and around Tripoli (Feb–Apr 1957) with British War Office and Army support; interiors at Victorine, Nice. A canonical auteur film — Godard famously championed it — with Libya as its moral desert.","synAr":"","cens":"","src":["Bitter Victory · Wikipedia · en.wikipedia.org/wiki/Bitter_Victory","IMDb · imdb.com/title/tt0050126","TCM database entry · tcm.com","AFI Catalog · catalog.afi.com/Catalog/moviedetails/52480"],"copies":[],"phys":[],"notes":"","poster":1,"stills":0,"open":[],"created":"2026-06-11","web":["08_Flm_026_poster-1.jpg"]},{"n":27,"code":"08_Flm_027","kind":"film","t":"Legend of the Lost","en":"Legend of the Lost","ar":"","alt":"","y":"1957","ys":1957,"ty":["Fiction — Feature","روائي طويل"],"rel":[["Shot in Libya","صُوّر في ليبيا"]],"dir":["Henry Hathaway"],"prod":[],"ctry":[["USA","أمريكا"],["Italy","إيطاليا"]],"lang":[["English","إنجليزي"]],"surv":"private","survL":["Digitized — held privately","مرقمن بحوزة خاصة"],"comp":["Completed","مكتمل"],"run":"","fmt":["35mm","35mm"],"fest":[],"awards":[],"log":"","synEn":"Technirama/Technicolor adventure: a guide, a drifter and a zealot trek into the Sahara hunting a lost city and treasure. Story is set out of Timbuktu — but the film is a Libyan production event: headquarters in Ghadames (employing villagers and Tuareg), dunes near Tripoli, the Roman ruins of Leptis Magna as the lost city, Zliten standing in for Timbuktu; interiors at Cinecittà after John Wayne's on-location injury. One of the largest foreign productions ever mounted in Kingdom-era Libya.","synAr":"","cens":"","src":["Legend of the Lost · Wikipedia · en.wikipedia.org/wiki/Legend_of_the_Lost","IMDb trivia (locations) · imdb.com/title/tt0050629/trivia","TCM notes · tcm.com"],"copies":[],"phys":[],"notes":"","poster":1,"stills":0,"open":[],"created":"2026-06-11","web":["08_Flm_027_poster-1.jpg"]},{"n":28,"code roup raid drama set before El Alamein: a patrol drives deep behind Axis lines in Libya to destroy a fuel dump. Shot entirely on location in Tripolitania over eight weeks (from 12 May 1958), near sites of the real desert war, with the LRDG's actual wartime intelligence officer as advisor. Guy Green: the producers 'wanted to shoot it in the studio with a pile of sand… so we shot it in Libya at a time when the king still held sway.'","synAr":"","cens":"","src":["Sea of Sand · Wikipedia · en.wikipedia.org/wiki/Sea_of_Sand","IMDb (as Desert Patrol) · imdb.com/title/tt0051532","itp Global Film essay · itpworld.online · 2023"],"copies":[],"phys":[],"notes":"","poster":1,"stills":0,"open":[],"created":"2026-06-11","web":["08_Flm_029_poster-1.jpg"]},{"n":30,"code":"08_Cor_030","kind":"corpus","t":"قسم السينما بوزارة الأنباء والإرشاد — state documentaries","en":"Cinema Section, Ministry of News & Guidance — documentary corpus","ar":"","alt":"","y":"1959–1973","ys":1959,"ty":["Documentary — Short","وثائقي قصير"],"rel":[["Libyan production–funding","إنتاج ليبي"],["Shot in Libya","صُوّر في ليبيا"],["About Libya","عن ليبيا"]],"dir":[],"prod":["قسم السينما، وزارة الأنباء والإرشاد (تأسس 1959)","أقسام سينما بوزارتي التربية والصحة وبعض المحافظات"],"ctry":[["Libya","ليبيا"]],"lang":[["Arabic","عربي"]],"surv":"unknown","survL":["Unknown","غير معروف"],"comp":null,"run":"","fmt":["35mm","35mm"],"fest":[],"awards":[],"log":"","synEn":"A body of material, not a single work — the Kingdom's state film apparatus. Per Farjani: a Cinema Section established 1959 under the Ministry of News & Guidance handling production and exhibition (parallel sections in Education, Health, provinces); a black-and-white film lab built; a film library assembled; weekly mobile-cinema vans screening to towns without theatres. Foreign companies executed some commissions. This corpus + the national newsreel = the whole of Libyan state filmmaking before the GOC.","synAr":"","cens":"","src":["الفرجاني · قصة الخيالة العربية الليبية · via رمضان سليم، cinematripoli.blogspot.com 2008"],"copies":[],"phys":[],"notes":"Venue history from the same source: first cinema = سينما توغراف باب البحر, Tripoli 1908 (Ottoman era), entrance through the Arch of Marcus Aurelius — demolished by the Italians to expose the arch. Italian-era and later venues named by Farjani: الغرياني، الخمس القديمة، البرنيتشي (بنغازي)، الماريماريو، الهمبرا، الرشيد، الغزالة، الرويال، النصر، القابي، أوديون، متروبول، ريكس، لوكس، النهضة، الشرق، الجلاء، الزهرة… 40+ active houses in some 1960s years; 13 in Tripoli 1966 (9 foreigner-oriented, 4 for citizens); summer open-air venues; screenings at Wheelus base and the Egyptian Cultural Centre.","poster":0,"stills":0,"open":["survival"],"created":"2026-06-11","web":[]},{"n":31,"code":"08_Flm_031","kind":"film","t":"Tobruk","en":"Tobruk","ar":"طبرق","alt":"","y":"1967","ys":1967,"ty":["Fiction — Feature","روائي طويل"],"rel":[["About Libya","عن ليبيا"]],"dir":["Arthur Hiller"],"prod":[],"ctry":[["USA","أمريكا"]],"lang":[["English","إنجليزي"]],"surv":"private","survL":["Digitized — held privately","مرقمن بحوزة خاصة"],"comp":["Completed","مكتمل"],"run":"","fmt":["35mm","35mm"],"fest":[],"awards":[],"log":"","synEn":"WWII action: a Long Range Desert Group officer and a unit of German-Jewish commandos (the Special Identification Group) infiltrate Axis lines to destroy Tobruk's fuel bunkers. Shot in the US (Yuma area) — Libya as Hollywood backlot again — but notable for centring the SIG's German-Jewish soldiers. Footage was heavily reused in later war films.","synAr":"","cens":"","src":["Tobruk (1967 film) · Wikipedia · en.wikipedia.org/wiki/Tobruk_(1967_film)","IMDb · imdb.com/title/tt0062377","AFI Catalog · catalog.afi.com/Catalog/moviedetails/19818"],"copies":[],"phys":[],"notes":"","poster":1,"stills":0,"open":[],"created":"2026-06-11","web":["08_Flm_031_poster-1.jpg"]},{"n":32,"code":"08_Flm_032","kind":"film","t":"صائد الحوت","en":"The Whale Hunter","ar":"صائد الحوت","alt":"","y":"1967","ys":1967,"ty":["Fiction — Short","روائي قصير"],"rel":[["Libyan director","مخرج ليبي"],["Libyan production–funding","إنتاج ليبي"],["Shot in Libya","صُوّر في ليبيا"]],"dir":["محمد علي الفرجاني | Mohammed Ali al-Farjani"],"prod":[],"ctry":[["Libya","ليبيا"]],"lang":[["Arabic","عربي"],["Libyan dialect","لهجة ليبية"]],"surv":"lost","survL":["Lost","مفقود"],"comp":["Completed","مكتمل"],"run":"","fmt":null,"fest":[],"awards":[],"log":"","synEn":"The first known Libyan fiction film attempt: a short directed by Mohammed Ali al-Farjani in 1967 — two years before the coup. The film was completed in shooting, but the print was ruined during laboratory processing abroad ('تعرض للتلف التام') and the work was lost in its entirety. Farjani went on to direct الشظية (1984) and to write the foundational history of Libyan cinema in which this loss is recorded.","synAr":"","cens":"","src":["الفرجاني · قصة الخيالة العربية الليبية · via رمضان سليم، cinematripoli.blogspot.com 2008"],"copies":[],"phys":[],"notes":"","poster":0,"stills":0,"open":[],"created":"2026-06-11","web":[]},{"n":33,"code":"08_Cor_033","kind":"corpus","t":"Libyan Television — opening broadcasts & early corpus","en":"Libyan TV first broadcasts","ar":"افتتاح التلفزيون الليبي","alt":"","y":"1968–","ys":1968,"ty":["TV film–series","تلفزيوني"],"rel":[["Shot in Libya","صُوّر في ليبيا"],["About Libya","عن ليبيا"],["Libyan production–funding","إنتاج ليبي"]],"dir":[],"prod":["Libyan Television (Tripoli & Benghazi stations)"],"ctry":[["Libya","ليبيا"]],"lang":[["Arabic","عربي"],["Libyan dialect","لهجة ليبية"]],"surv":"private","survL":["Digitized — held privately","مرقمن بحوزة خاصة"],"comp":null,"run":"","fmt":["Video–tape","فيديو"],"fest":[],"awards":[],"log":"","synEn":"A body of material, not a single work, and the beginning of Libyan-made moving images at institutional scale. Regular television began 24 December 1968 (17th anniversary of independence) from Tripoli and Benghazi, opening with coverage of the Independence Day parade — nine months before the 1969 coup, making the earliest material a unique audiovisual record of the Kingdom's final year. The opening ceremony and first news bulletin survive and circulate as clips on Libyan nostalgia pages. Predecessor: 'Voice of Libya' radio, handed to the Ministry of Information in 1956; US financing contributed to the TV build-out.","synAr":"","cens":"","src":["Television in Libya · Wikipedia · en.wikipedia.org/wiki/Television_in_Libya","Arab Media Systems, ch. 15 Libya · Open Book Publishers · books.openbookpublishers.com/10.11647/obp.0238/ch15.xhtml","Libyan Jamahiriya Broadcasting Corporation · Wikipedia"],"copies":[],"phys":[],"notes":"","poster":0,"stills":0,"open":[],"created":"2026-06-11","web":[]},{"n":34,"code":"08_Res_034","kind":"lead","t":"محاولة روائية أولى — الشركة الليبية للإنتاج السينمائي","en":"[First feature attempt — Libyan Cinema Production Co. — halted]","ar":"","alt":"","y":"1970","ys":1970,"ty":["Fiction — Feature","روائي طويل"],"rel":[["Libyan production–funding","إنتاج ليبي"]],"dir":[],"prod":["الشركة الليبية للإنتاج السينمائي (private; producer علي الهلودي)"],"ctry":[["Libya","ليبيا"]],"lang":[["Arabic","عربي"]],"surv":"unknown","survL":["Unknown","غير معروف"],"comp":["Unfinished","غير مكتمل"],"run":"","fmt":null,"fest":[],"awards":[],"log":"","synEn":"Per Farjani: the first attempt to make a Libyan fiction feature, undertaken in 1970 by the private الشركة الليبية للإنتاج السينمائي of producer Ali al-Haloudi — halted at its very beginning. The same company then completed عندما يقسو القدر (Zarrouk), the first Libyan feature actually screened. Title of the abandoned project unrecorded in the source.","synAr":"","cens":"","src":["الفرجاني · قصة الخيالة العربية الليبية · via cinematripoli.blogspot.com 2008"],"copies":[],"phys":[],"notes":"","poster":0,"stills":0,"open":["survival"],"created":"2026-06-11","web":[]},{"n":35,"code":"08_Res_035","kind":"lead","t":"الذاكرة","en":"Al-Dhakira / The Memory","ar":"الذ ,{"n":41,"code":"08_Flm_041","kind":"film","t":"السفراء","en":"The Ambassadors (Les Ambassadeurs)","ar":"السفراء","alt":"","y":"1975","ys":1975,"ty":["Fiction — Feature","روائي طويل"],"rel":[["Libyan production–funding","إنتاج ليبي"]],"dir":["ناصر القطاري | Naceur Ktari"],"prod":["Tunisian production with Libyan co-production — المؤسسة العامة للخيالة listed among co-producers per Farjani"],"ctry":[["Tunisia","تونس"],["Libya","ليبيا"],["France","فرنسا"]],"lang":[["Arabic","عربي"],["French","فرنسي"]],"surv":"private","survL":["Digitized — held privately","مرقمن بحوزة خاصة"],"comp":["Completed","مكتمل"],"run":"","fmt":["35mm","35mm"],"fest":["أيام قرطاج السينمائية (JCC Carthage) · 1976 · competition · won","Locarno Film Festival · competition · special jury prize"],"awards":["التانيت الذهبي (Tanit d'Or) · أيام قرطاج · 1976 · the film","Special Jury Prize · Locarno · the film"],"log":"","synEn":"Naceur Ktari's landmark drama of Maghrebi migrant workers in Paris (the Goutte d'Or) facing racism and violence — the first Tunisian film to put emigration at its centre. Listed by Farjani among the GOC's co-productions: Libya's state cinema money behind one of the most awarded Arab films of the decade.","synAr":"","cens":"","src":["السينما التونسية تقتفي آثار المهاجرين · Jadaliyya · jadaliyya.com/Details/40761","الفرجاني · قصة الخيالة العربية الليبية · via cinematripoli 2008","السفراء (فيلم) · ويكيبيديا العربية"],"copies":[],"phys":[],"notes":"","poster":1,"stills":0,"open":[],"created":"2026-06-11","web":["08_Flm_041_poster-1.jpg"]},{"n":42,"code":"08_Flm_042","kind":"film","t":"الرسالة / The Message","en":"The Message (Mohammad, Messenger of God)","ar":"الرسالة","alt":"Mohammad, Messenger of God; الرسالة (Arabic-language version shot in parallel — a distinct version)","y":"1976","ys":1976,"ty":["Fiction — Feature","روائي طويل"],"rel":[["Shot in Libya","صُوّر في ليبيا"],["Libyan production–funding","إنتاج ليبي"]],"dir":["مصطفى العقاد | Moustapha Akkad"],"prod":[],"ctry":[["Libya","ليبيا"],["Other","أخرى"]],"lang":[["English","إنجليزي"],["Arabic","عربي"]],"surv":"online","survL":["Online — publicly viewable","متاح علناً"],"comp":["Completed","مكتمل"],"run":"","fmt":["35mm","35mm"],"fest":[],"awards":[],"log":"","synEn":"Akkad's epic of Islam's origins — and materially a Libyan film event: when Saudi pressure forced Morocco to expel the production (Aug 1974), Gaddafi granted refuge and money; filming resumed in Libya October 1974–May 1975, with the desert sequences completed there. $10M raised from Kuwait, Libya, Morocco, Saudi Arabia and the US. Shot as two parallel films — English and Arabic casts performing each scene in turn — a textbook two-versions case for the catalogue. With Lion of the Desert, the work that shaped how Libyans saw cinema itself (New Lines).","synAr":"","cens":"","src":["The Message (1976 film) · Wikipedia · en.wikipedia.org/wiki/The_Message_(1976_film)","How 'The Message' and 'The Lion of the Desert' Forever Shaped How Libyans See Themselves · New Lines Magazine · newlinesmag.com","NPR · 40 Years On… · 2016 · npr.org","IMDb trivia · imdb.com/title/tt0074896"],"copies":[],"phys":[],"notes":"","poster":1,"stills":0,"open":[],"created":"2026-06-11","web":["08_Flm_042_poster-1.jpg"]},{"n":43,"code":"08_Flm_043","kind":"film","t":"الضوء الأخضر","en":"The Green Light","ar":"الضوء الأخضر","alt":"","y":"1976","ys":1976,"ty":["Fiction — Feature","روائي طويل"],"rel":[["Libyan production–funding","إنتاج ليبي"],["Shot in Libya","صُوّر في ليبيا"]],"dir":["عبدالله المصباحي | Abdellah Mesbahi"],"prod":["المؤسسة العامة للخيالة (General Organization for Cinema)"],"ctry":[["Libya","ليبيا"]],"lang":[["Arabic","عربي"]],"surv":"unknown","survL":["Unknown","غير معروف"],"comp":["Completed","مكتمل"],"run":"","fmt":["35mm","35mm"],"fest":[],"awards":[],"log":"","synEn":"The GOC's first fiction feature (screened 1976): a Libyan production directed by Moroccan Abdellah Mesbahi with actors from Egypt, Tunisia and Morocco — a deliberately pan-  commando raids a German position near Tobruk, loses its lieutenant, and the four survivors — with a captured German officer — drive a stolen vehicle across the Libyan desert toward El Alamein. Audiard's celebrated dialogue made it a French classic. Not shot in North Africa: insurers refused (pre-Algerian-independence instability), so Almería, Spain stood in for Libya — the catalogue's recurring imagined-Libya pattern in its French variant.","synAr":"","cens":"","src":["Un taxi pour Tobrouk · Wikipédia (fr) · fr.wikipedia.org/wiki/Un_taxi_pour_Tobrouk","IMDb · imdb.com/title/tt0054425","AlloCiné · allocine.fr/film/fichefilm_gen_cfilm=4542.html"],"copies":[],"phys":[],"notes":"","poster":1,"stills":0,"open":[],"created":"2026-06-11","web":["08_Flm_067_poster-1.jpg"]},{"n":68,"code":"08_Flm_068","kind":"film","t":"Le rose del deserto","en":"The Roses of the Desert","ar":"","alt":"","y":"2006","ys":2006,"ty":["Fiction — Feature","روائي طويل"],"rel":[["About Libya","عن ليبيا"]],"dir":["Mario Monicelli"],"prod":[],"ctry":[["Italy","إيطاليا"]],"lang":[["Italian","إيطالي"],["Arabic","عربي"]],"surv":"private","survL":["Digitized — held privately","مرقمن بحوزة خاصة"],"comp":["Completed","مكتمل"],"run":"","fmt":["35mm","35mm"],"fest":[],"awards":[],"log":"","synEn":"Mario Monicelli's last film, made at 91: an Italian army medical unit ('Minotauro') stationed at the Sorman oasis in Libya, summer 1940 — war at a distance, letters home, photography, and medical care given to the local population, until the front arrives. Sixty-five years after Bengasi and Giarabub, Italian cinema returns to its Libyan war in an elegiac, anti-rhetorical key — the closing bracket of the Italian-war-in-Libya strand that opens this catalogue.","synAr":"","cens":"","src":["Le rose del deserto · it.wikipedia + en.wikipedia (The Roses of the Desert)","IMDb · imdb.com/title/tt0470082","MYmovies · mymovies.it/film/2006/le-rose-del-deserto"],"copies":[],"phys":[],"notes":"","poster":1,"stills":0,"open":[] e work — the screen corpus of the affair that defined Libya's global image in the 1990s: the 1988 bombing, sanctions decade, the Camp Zeist trial (2000–01), al-Megrahi's release (2009) — each phase generated documentaries and TV investigations (UK, US, and Arabic broadcasters), continuing into later dramatizations. For the catalogue's image-of-Libya strand the Lockerbie corpus IS the 1990s.","synAr":"","cens":"","src":[],"copies":[],"phys":[],"notes":"","poster":0,"stills":0,"open":["sources"],"created":"2026-06-11","web":[]},{"n":71,"code":"08_Cor_071","kind":"corpus","t":"Foreign TV documentaries on Gaddafi's Libya","en":"The Gaddafi-era documentary gaze","ar":"وثائقيات أجنبية عن ليبيا القذافي","alt":"","y":"1969–2011","ys":1969,"ty":["Documentary — Feature","وثائقي طويل"],"rel":[["About Libya","عن ليبيا"],["Shot in Libya","صُوّر في ليبيا"]],"dir":[],"prod":[],"ctry":[["UK","بريطانيا"],["France","فرنسا"],["Italy","إيطاليا"],["USA","أمريكا"]],"lang":[["English","إنجليزي"],["French","فرنسي"],["Italian","إيطالي"]],"surv":"private","survL":["Digitized — held privately","مرقمن بحوزة خاصة"],"comp":null,"run":"","fmt":null,"fest":[],"awards":[],"log":"","synEn":"A body of material, not a single work — four decades of foreign broadcasters filming inside (and about) Jamahiriya Libya: state-managed access tours, revolution anniversaries, the 1986 bombing aftermath, sanctions life, the 2000s 'reopening'. Holdings sit in BBC/ITN, INA (France), RAI (Italy) and US network archives — with INA and RAI especially valuable given French/Italian access patterns. Often the only professional footage of 1980s–90s Libyan daily life, whatever its framing.","synAr":"","cens":"","src":[],"copies":[],"phys":[],"notes":"","poster":0,"stills":0,"open":["sources"],"created":"2026-06-11","web":[]},{"n":72,"code":"08_Cor_072","kind":"corpus","t":"Libyan TV drama (الدراما الليبية)","en":"Libyan television drama of the 1990s–2000s","ar":"الدراما التلفزيونية الليبية","alt":"","y":"","ys":null,"ty":[   D.st=Math.max(1,Math.min(5,n));saveDraft();renderSubmit();focusStep();
  const s=$("#submit");if(s&&s.getBoundingClientRect().top<SB())jumpTo(s,false);}
function focusStep(){requestAnimationFrame(()=>{const want=FOCUS&&$("#submit .pane.on #f_"+FOCUS);const el=want||$("#submit .pane.on input:not(.hp),#submit .pane.on textarea");if(el)try{el.focus({preventScroll:true})}catch(e){el.focus()}});}
/* from the call card, the nav, another page (#submit), or a record (#add/CODE) */
function openSubmit(code,scroll){document.body.classList.remove("r");
  if(code)want({att:code});else{PENDING=null;if(STATE!=="error"&&STATE!=="sending")STATE="form";SENT=null;OPEN=true;renderSubmit();}
  requestAnimationFrame(()=>{measure();slices();if(scroll!==false)jumpTo($("#submit"),false);if(OPEN)focusStep();});}
async function send(){
  if(STATE==="sending")return;
  if(!D.t.trim()&&!D.att){goStep(1);return;}
  const hp=($("#f_hp")||{}).value||"",lab=(list,k)=>{const p=list.find(x=>x[0]===k);return p?(p[1]&&p[1]!==p[0]?p[0]+" / "+p[1]:p[0]):k;};
  const done=()=>{SENT={code:D.code,t:D.t.trim(),att:D.att};
    const l=store.get(SKEY,[]);l.push({code:D.code,t:SENT.t,att:D.att,at:new Date().toISOString()});store.set(SKEY,l.slice(-20));store.del(DKEY);
    D=blank();STATE="done";};
  if(hp){done();renderSubmit();return;}   /* a filled honeypot is a bot: nothing is sent (the workflow drops it too) */
  const body=new URLSearchParams({code:D.code,kind:D.att?"addition":"new",att:D.att||"",t:D.t.trim(),ar:D.ar.trim(),y:D.y.trim(),
    ty:D.ty?lab(TYS,D.ty):"",rl:D.rl.map(k=>lab(RLS,k)).join(" · "),d:D.d.trim(),nt:D.nt.trim(),
    src:D.refs.filter(r=>r.u.trim()).map(r=>(C.en.srcKinds.find(k=>k[0]===r.k)||["",r.k])[1]+" — "+r.u.trim()).join("\n"),
    who:D.who.trim(),cons:D.cons?(C.en.cons.find(c=>c[0]===D.cons)||["",D.cons])[1]:"",em:D.em.trim(),lang,
    page:location.protocol==="file:"?"prototype · local file":location.origin+location.pathname,hp:""});
  STATE="sending";renderSubmit();
  try{const r=await fetch(HOOK,{method:"POST",body});let j={};try{j=await r.json()}catch(e){}
    if(!r.ok||(j.status&&j.status!=="success"))throw new Error("HTTP "+r.status);
    done();
  }catch(e){STATE="error";}
  renderSubmit();jumpTo($("#submit"),false);}

/* ══ the record page ═══════════════════════════════════════════════ */
function route(){const m=/^#r\/([\w-]+)$/.exec(location.hash||"");const f=m&&F.find(x=>x.code===m[1]);WHERE="";requestAnimationFrame(()=>where(null));
  document.body.classList.toggle("r",!!f);if(!f){return;}
  const L=lang==="ar",d=DMY(SNAP.taken),lead=f.kind!=="film",arr=L?"←":"→";
  const sv=lead?[T("seeLead"),T("seeLeadS")]:[svL(f),C[lang].svS[f.surv]||""];
  const dl=(rows)=>`<dl>${rows.filter(x=>x[1]&&(!Array.isArray(x[1])||x[1].length)).map(x=>`<dt>${esc(x[0])}</dt><dd dir="auto">${esc(Array.isArray(x[1])?x[1].join(" · "):x[1])}</dd>`).join("")}</dl>`;
  const rel=F.filter(x=>x!==f&&((f.dir.length&&x.dir.some(y=>f.dir.includes(y)))||(f.prod.length&&x.prod.some(y=>f.prod.includes(y)))||(f.ys&&x.ys&&Math.floor(x.ys/10)===Math.floor(f.ys/10)&&x.kind==="film"))).slice(0,8);
  const ttl=TI(f),imgs=(f.web||[]);
  const run=f.run?(/^\d+$/.test(f.run)?f.run+" "+T("min"):f.run):"";
  const yr=f.y?(L?"، "+f.y:", "+f.y):"";
  const cite=L?`ميراث، «${esc(ttl)}»${esc(yr)}، أرشيف الأفلام، ${esc(f.code)}. merath.ly/archives/film#r/${esc(f.code)}. ${T("accessed")} ${d}.`
             :`merath, “${esc(f.clean)}”${esc(yr)}, The Films Archive, ${esc(f.code)}. merath.ly/archives/film#r/${esc(f.code)}. ${T("accessed")} ${d}.`;
  $("#rec").innerHTML=`<a class="back" href="#"><span class="ar" aria-hidden="true">←</span>${T("h1")}</a>
   <span class="code mono" dir="ltr">${esc(f.code)} · ${esc(lead?C[lang].kinds[f.kind]:(f.ty?f.ty[L?1:0]:""))}</span>
   <h1 dir="auto">${esc(ttl)}</h1>${TI2(f)?`<div class="alt" dir="auto">${esc(TI2(f))}</div>`:""}
   <div class="line mono">${f.y?`<span dir="ltr">${esc(f.y)}</span>`:""}${f.y&&f.dir.length?" · ":""}${f.dir.length?esc(f.dir.join(" · ")):""}</div>
   <div class="cert">
    <div class="cp obj"><span class="k">${T("obj")}</span><b>${f.poster?T("objH"):(f.stills?T("objS"):T("objN"))}</b><span>${f.poster||f.stills?[f.poster?fmt(T(f.poster>1?"objPs":"objP"),{n:f.poster}):"",f.stills?fmt(T(f.stills>1?"objSts":"objSt"),{n:f.stills}):"",T("objHs")].filter(Boolean).join(" · "):T("objNs")}</span>
      ${imgs.length?`<div class="imgs">${imgs.map(n=>`<img src="${IMG}${esc(n)}" alt="" loading="lazy" onerror="this.remove()">`).join("")}</div>`:""}</div>
    <div class="cp"><span class="k">${T("see")}</span><b><i class="box ${boxC(f)}"></i> ${esc(sv[0])}</b><span dir="auto">${esc(sv[1]||"")}</span></div>
    <div class="cp unc${f.open.length?"":" none"}"><span class="k">${T("miss")}</span><b>${f.open.length===1?T("missN1"):f.open.length?fmt(T("missN"),{n:f.open.length}):T("miss0")}</b><span>${esc(f.open.map(k=>C[lang].fields[k]).join(" · "))}</span>${f.open.length?`<a href="#add/${esc(f.code)}">${T("missGo")}</a>`:""}</div></div>
   ${f.notes?`<div class="note"><span class="k">${T("note")}</span><p dir="auto">${esc(f.notes)}</p></div>`:""}
   <div class="rgrid"><div>
    ${f.log||f.synEn||f.synAr?`<div class="rs"><h3>${T("desc")}</h3>${f.log?`<p dir="auto"><b>${esc(f.log)}</b></p>`:""}${(L?f.synAr||f.synEn:f.synEn||f.synAr)?`<p dir="auto">${esc(L?f.synAr||f.synEn:f.synEn||f.synAr)}</p>`:""}</div>`:""}
    <div class="rs"><h3>${T("credits")}</h3>${dl([[T("dir"),f.dir],[T("prod"),f.prod],[T("ty"),f.ty?f.ty[L?1:0]:""],[T("relL"),f.rel.map(L2)],[T("ctry"),(f.ctry||[]).map(L2)],[T("lang"),(f.lang||[]).map(L2)],[T("run"),run],[T("fmt"),f.fmt?f.fmt[L?1:0]:""],[T("comp"),f.comp?f.comp[L?1:0]:""]])}</div>
    ${f.fest.length||f.awards.length||f.cens?`<div class="rs"><h3>${T("life")}</h3>${dl([[T("fest"),f.fest],[T("aw"),f.awards],[T("cens"),f.cens]])}</div>`:""}
    ${f.src.length?`<div class="rs"><h3>${T("sources")} · ${f.src.length}</h3><ol>${f.src.map(s=>`<li dir="auto">${esc(s)}</li>`).join("")}</ol></div>`:""}
   </div><div>
    <div class="rs"><h3>${T("hist")}</h3>${dl([[T("acc"),f.code],[T("entered"),DMY(f.created)],[T("version"),d]])}<a class="go2" href="#add/${esc(f.code)}" style="margin-top:.9rem">${T("correct")}</a></div>
    ${rel.length?`<div class="rs rel"><h3>${T("rel")}</h3>${rel.map(x=>`<a href="#r/${esc(x.code)}"><i class="box ${boxC(x)}"></i><span dir="auto">${esc(TI(x))}</span><span class="y mono" dir="ltr">${esc(x.y||"")}</span></a>`).join("")}</div>`:""}
    <div class="rs"><h3>${T("cite")}</h3><div class="cite mono" dir="${L?"rtl":"ltr"}">${cite}</div></div>
   </div></div>`;
  scrollTo(0,0);}
function onHash(){const h=location.hash||"";
  if(h==="#submit"){openSubmit(null,true);return;}
  const a=/^#add\/([\w-]+)$/.exec(h);if(a){openSubmit(a[1],true);return;}
  if(/^#r\//.test(h)){route();return;}
  document.body.classList.remove("r");requestAnimationFrame(()=>{measure();slices();});}
addEventListener("hashchange",onHash);
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest('a[href^="#add/"]');if(!a)return;
  FOCUS=a.classList.contains("addy")?"y":"";clearTimeout(FOCUS_T);FOCUS_T=setTimeout(()=>{FOCUS="";},700);if(location.hash===a.getAttribute("href")){e.preventDefault();onHash();}});

{const fq=$("#fq"),qb=$("#qbox"),mark=()=>qb.classList.toggle("on",document.activeElement===fq||!!fq.value);
 fq.oninput=e=>{FQ=norm(e.target.value.trim());const y=scrollY;render();scrollTo(0,y);mark();

/* the search box writes its own invitation, letter by letter, and stops the moment someone is in it */
function typer(qb,inp,text){if(!qb||!inp)return;let tw=qb.querySelector(".tw");if(!tw){tw=document.createElement("span");tw.className="tw";tw.setAttribute("aria-hidden","true");qb.appendChild(tw);}
  clearTimeout(qb._tt);let i=0,d=1;tw.textContent="";const still=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
  const tick=()=>{const busy=document.activeElement===inp||!!inp.value;qb.classList.toggle("on",busy);
    if(busy){i=0;d=1;tw.textContent="";qb._tt=setTimeout(tick,450);return;}
    if(still){tw.textContent=text;qb._tt=setTimeout(tick,900);return;}
    i+=d;tw.textContent=text.slice(0,i);let w=d>0?70+Math.random()*70:26;
    if(i>=text.length){d=-1;w=2400;}else if(i<=0){d=1;w=900;}
    qb._tt=setTimeout(tick,w);};
  tick();}
/* the masthead band, and the nav strip's fade when there is more of it to scroll */
function chromeState(){document.documentElement.classList.toggle("scrolled",scrollY>4);
  const nv=document.getElementById("sidx");if(!nv||!nv.parentElement)return;const max=nv.scrollWidth-nv.clientWidth;
  nv.parentElement.classList.toggle("nmore",max>2&&Math.abs(nv.scrollLeft)<max-2);}
var NAVON=null;
function centerNav(){const nv=document.getElementById("sidx"),a=nv&&nv.querySelector("a.on");if(!nv||!a||a===NAVON)return;NAVON=a;
  const max=nv.scrollWidth-nv.clientWidth;if(max<=2)return;const rtl=getComputedStyle(nv).direction==="rtl";
  let x=a.offsetLeft+a.offsetWidth/2-nv.clientWidth/2;if(rtl)x-=max;nv.scrollTo({left:x,behavior:"smooth"});}

addEventListener("resize",()=>requestAnimationFrame(chromeState));
{const nv=$("#sidx");if(nv)nv.addEventListener("scroll",chromeState,{passive:true});}
